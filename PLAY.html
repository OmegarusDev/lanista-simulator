<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=https://omegarusdev.github.io/lanista-simulator/" />
  <title>Play Lanista Simulator</title>
  <style>
    :root {
      --bg: #1a1410;
      --fg: #f2e6d4;
      --muted: #b8a48c;
      --accent: #c45c26;
      --accent-hover: #d96a30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 50% 20%, #2c2118 0%, transparent 55%),
        linear-gradient(160deg, #120e0b 0%, var(--bg) 45%, #241a14 100%);
    }
    main {
      text-align: center;
      padding: 2rem 1.25rem;
      max-width: 28rem;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    a.play {
      display: inline-block;
      padding: 0.95rem 2.4rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      color: #fff8ef;
      background: var(--accent);
      border: 2px solid #e8c4a0;
      border-radius: 4px;
      box-shadow: 0 4px 0 #7a3514;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    a.play:hover { background: var(--accent-hover); }
    a.play:active { transform: translateY(2px); box-shadow: 0 2px 0 #7a3514; }
    noscript p { margin-top: 1rem; }
  </style>
  <script>
    location.replace('https://omegarusdev.github.io/lanista-simulator/');
  </script>
</head>
<body>
  <main>
    <h1>Lanista Simulator</h1>
    <p>Opening the live game… If nothing happens, use the button below.</p>
    <a class="play" href="https://omegarusdev.github.io/lanista-simulator/">▶ Play Now</a>
    <noscript>
      <p><a href="https://omegarusdev.github.io/lanista-simulator/">Continue to the game</a></p>
    </noscript>
  </main>
</body>
</html>
