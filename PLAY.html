<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play Lanista Simulator</title>
  <style>
    :root {
      --bg: #1a1410;
      --fg: #f2e8d4;
      --muted: #a09078;
      --accent: #c49a55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 50% 20%, #2c2118 0%, transparent 55%),
        linear-gradient(160deg, #120e0b 0%, var(--bg) 45%, #241a14 100%);
    }
    main {
      text-align: center;
      padding: 2rem 1.25rem;
      max-width: 28rem;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.45;
    }
    a.btn {
      display: inline-block;
      margin: 0.35rem;
      padding: 0.85rem 1.4rem;
      color: var(--fg);
      text-decoration: none;
      border: 1.5px solid var(--accent);
      background: #3a2818;
      font-weight: 600;
    }
    a.btn.primary {
      background: #6a4e2a;
    }
    .note {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>LANISTA</h1>
    <p>Local Lab first — use the dev server, not a stale Pages deploy.</p>
    <a class="btn primary" href="http://127.0.0.1:5299/lanista-simulator/">Play local (5299)</a>
    <a class="btn" href="https://omegarusdev.github.io/lanista-simulator/">GitHub Pages</a>
    <p class="note">Run <code>npm run dev</code> in the project, then hard-refresh (Cmd+Shift+R).</p>
  </main>
</body>
</html>
